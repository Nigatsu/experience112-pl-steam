name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test
      - run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: exp112-pl-patch
          path: dist/exp112-pl-patch.exe
