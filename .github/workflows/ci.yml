name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false # no external dependencies
      - run: make test
      - run: make build
      - uses: actions/upload-artifact@v7
        with:
          name: exp112-pl-patch
          path: dist/exp112-pl-patch.exe

  # Pushing a tag such as v1.1.0 builds that version and attaches the .exe
  # to the GitHub release of the tag (created if it does not exist yet).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: make build VERSION=${{ github.ref_name }}
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/exp112-pl-patch.exe --clobber
          else
            gh release create "$TAG" dist/exp112-pl-patch.exe --title "$TAG" --generate-notes
          fi
